# Who's Here? - works as-is in Portainer (Stacks > Repository), Synology Container Manager,
# or plain `docker compose up -d`.
#
# Settings: in Portainer, enter them under the stack's "Environment variables".
# Everywhere else, put them in a .env file next to this one (copy .env.example).
# Anything you don't set uses the default shown after ":-".
services:
  whoshere:
    build: .
    # To skip building, use the image GitHub Actions publishes from main instead:
    # image: ghcr.io/thomasbates-az/whoshere2:latest
    container_name: whoshere
    restart: unless-stopped
    # bridge (default): the board is on HOST_PORT. host: the app uses the server's own network,
    # so "Add my phone" sees phones' real addresses (needed on Synology); it listens on PORT
    # and HOST_PORT is ignored.
    network_mode: ${NETWORK_MODE:-bridge}
    ports:
      - "${HOST_PORT:-8085}:${PORT:-8080}"   # bridge mode: open http://<docker-host>:8085
    volumes:
      - whoshere-data:/data
    environment:
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      UNIFI_USERNAME: ${UNIFI_USERNAME:-}
      UNIFI_PASSWORD: ${UNIFI_PASSWORD:-}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      UNIFI_VERIFY_SSL: ${UNIFI_VERIFY_SSL:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VIEW_PASSWORD: ${VIEW_PASSWORD:-}
      SITE_TITLE: ${SITE_TITLE:-Who's Here?}
      TZ: ${TZ:-America/Phoenix}
      SELF_REGISTER: ${SELF_REGISTER:-false}
      REGISTER_CODE: ${REGISTER_CODE:-}
      STAFF_WIFI_NAME: ${STAFF_WIFI_NAME:-}
      WIFI_NETWORKS: ${WIFI_NETWORKS:-}
      SHOW_WIFI_NETWORK: ${SHOW_WIFI_NETWORK:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      DEPARTURE_GRACE_MINUTES: ${DEPARTURE_GRACE_MINUTES:-10}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-180}
      HISTORY_DAYS: ${HISTORY_DAYS:-365}
      DEVICE_RETENTION_DAYS: ${DEVICE_RETENTION_DAYS:-30}
      GOOGLE_CHAT_SUBSCRIPTION: ${GOOGLE_CHAT_SUBSCRIPTION:-}
      GOOGLE_CHAT_PROJECT: ${GOOGLE_CHAT_PROJECT:-}
      GOOGLE_CHAT_ALLOWED: ${GOOGLE_CHAT_ALLOWED:-}
      GOOGLE_CHAT_PRIVATE_REPLIES: ${GOOGLE_CHAT_PRIVATE_REPLIES:-true}
      BOARD_URL: ${BOARD_URL:-}
      CHAT_AVATAR_URL: ${CHAT_AVATAR_URL:-}
      API_TOKEN: ${API_TOKEN:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-true}
      WATCH_PUSH: ${WATCH_PUSH:-clear}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-8080}

volumes:
  whoshere-data:
