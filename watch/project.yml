# Xcode project for the Who's Here Apple Watch app, generated by XcodeGen:
#   brew install xcodegen && xcodegen
# Change the three settings marked CHANGE, then run xcodegen again.
name: WhosHere
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    # CHANGE: your Apple Developer Team ID (developer.apple.com → Membership).
    DEVELOPMENT_TEAM: ""
    # CHANGE: a bundle ID you own. The server's APNS_BUNDLE_ID must be exactly this.
    WH_BUNDLE_ID: org.example.whoshere.watchkitapp
    # CHANGE (optional): the board's address, so the app works without typing it on the watch.
    # Example: http://192.168.1.20:8085
    WH_BOARD_URL: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "4"
    GENERATE_INFOPLIST_FILE: NO
targets:
  WhosHere:
    type: application
    platform: watchOS
    sources:
      - path: WhosHere
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: WhosHere
        PRODUCT_BUNDLE_IDENTIFIER: $(WH_BUNDLE_ID)
        INFOPLIST_FILE: WhosHere/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhosHere/WhosHere.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: WhosHereComplications
        embed: true
  WhosHereComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: Complications
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: WhosHereComplications
        PRODUCT_BUNDLE_IDENTIFIER: $(WH_BUNDLE_ID).complications
        INFOPLIST_FILE: Complications/Info.plist
        CODE_SIGN_ENTITLEMENTS: Complications/Complications.entitlements
        SKIP_INSTALL: YES
schemes:
  WhosHere:
    build:
      targets:
        WhosHere: all
        WhosHereComplications: all
    run:
      config: Debug
